    <script>
      // 提前应用主题，避免暗色模式闪白
      (function () {
        try {
          var m = localStorage.getItem('nuono_theme')
          if (m === 'dark' || (!m && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
          document.documentElement.setAttribute('data-card-material', localStorage.getItem('nuono_card_material') === 'frosted' ? 'frosted' : 'solid')
        } catch (e) {}
      })()
    </script>
