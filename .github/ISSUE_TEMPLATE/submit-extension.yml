name: 提交插件或适配器
description: 填写公开 GitHub 仓库地址，即可向 Nuono 官方商店登记插件或平台适配器。
title: "[扩展提交] "
labels:
  - extension-submission
body:
  - type: markdown
    attributes:
      value: |
        欢迎向 Nuono 官方商店提交插件或平台适配器（支持公开 GitHub 仓库）。

        只需填写你的 GitHub 仓库地址，其余信息（扩展类型 `plugin`/`adapter`、ID、版本号、作者、开源协议与最新提交）会在审核通过后自动从仓库的 `Cargo.toml` 中读取，无需手填。
        维护者审核源码并给本 Issue 打上 `extension:approved` 标签后，GitHub Actions 会自动上架到官方商店目录；后续你向仓库推送新版本时，目录也会定时同步。
  - type: input
    id: repository
    attributes:
      label: GitHub 源码仓库
      description: 填写公开 GitHub 仓库 HTTPS 地址，仓库根目录需包含有效的 Nuono 插件或适配器 `Cargo.toml`。
      placeholder: https://github.com/your-name/your-plugin
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 展示名称
      description: 可选；留空则自动使用仓库 `Cargo.toml` 中的名称。
      placeholder: My Plugin
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 简介
      description: 可选；留空则自动使用仓库 `Cargo.toml` 中的 `description`。
      placeholder: 一两句话说明扩展的功能
    validations:
      required: false
  - type: checkboxes
    id: agreement
    attributes:
      label: 提交确认
      options:
        - label: 该仓库公开可访问，根目录包含有效的 Nuono 插件或适配器 `Cargo.toml`。
          required: true
