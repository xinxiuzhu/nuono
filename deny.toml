[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # sqlx-sqlite 0.9 固定依赖 libsqlite3-sys 0.37（修复在 0.39）；本地构造不匹配 WAL 文件对的攻击面不适用于宿主自管库。
    "RUSTSEC-2026-0459",
    # 上游 sea-orm / sqlx / croner 与工作区时间模型仍依赖 chrono 生态，暂保留直至整体迁移。
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots 包含的 Mozilla/CCADB 根证书数据协议
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    # borrow-or-share 使用的 MIT No Attribution 协议（OSI 认证）
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace 内部 crate 用 path 依赖互相引用，不写版本号，会被判成 wildcard
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 上游仓库已在 Cargo.toml 中固定到完整 commit。
allow-git = [
    "https://github.com/h4ckf0r0day/obscura",
]
