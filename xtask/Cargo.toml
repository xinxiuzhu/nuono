[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "GPL-3.0-only"
default-run = "xtask"

# 开发工具独立于主应用的生产依赖图。
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
sha2 = "0.11"
toml = "1.1"
tempfile = "3"
libc = "0.2"
# 仅用于本机 HTTP 健康检查，开发运行器不需要 TLS。
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
incremental = true
