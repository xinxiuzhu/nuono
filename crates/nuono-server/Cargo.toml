[package]
name = "nuono-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nuono-domain = { workspace = true }
nuono-tooling = { workspace = true }
nuono-adapter = { workspace = true }
nuono-plugin = { workspace = true }
fs2 = { workspace = true }
nuono-app = { workspace = true }
nuono-core = { workspace = true }
# 数据库备份/恢复与隔离库测试统一使用 SeaORM。
sea-orm = { workspace = true }
urlencoding = { workspace = true }

# 核心基础设施
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "signal", "process"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

# Web 服务
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true }

# HTTP 客户端
reqwest = { workspace = true }

# 异步工具
futures = { workspace = true }
async-trait = { workspace = true }

# 接口文档
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# 会话与内容摘要
sha2 = { workspace = true }
hex = { workspace = true }

# 配置
toml = { workspace = true }

# 常用工具
dashmap = { workspace = true }
image = { workspace = true }
ipnet = { workspace = true }
if-addrs = { workspace = true }
uuid = { workspace = true }

# 指标
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Utils
rand = { workspace = true }
base64 = { workspace = true }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
tar = "0.4.46"
flate2 = "1"
rpassword = "7"

[target.'cfg(unix)'.dependencies]
# 签名媒体按 NOFOLLOW 打开，防止签发后被换入的软链接改变实际读取目标。
rustix = { version = "1.1.5", features = ["fs"] }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
nuono-adapter-fixture = { path = "../../xtask/fixtures/adapter-host" }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
tower = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
